[package]
name = "km-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = { version = "4.15.0", features = ["cookies"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["rand_core"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
maud = { version = "0.27.0", features = ["actix-web"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "uuid", "chrono", "runtime-tokio"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
