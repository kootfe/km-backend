[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.13.0"
bcrypt = "0.19.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
redis_rs = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["postgres", "macros", "uuid", "runtime-tokio", "chrono"] }
time = { version = "0.3.47", features = ["serde"] }
uuid = { version = "1.23.3", features = ["serde"] }

